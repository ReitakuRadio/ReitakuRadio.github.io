<!DOCTYPE html>

<head>

    <link rel="icon" type="image/x-icon" href="assets/img/logo.ico">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* 下層ページ用のヘッダースタイル */
        .page-header {
            position: relative;
            height: 50vh;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
             background-image: url('./assets/img/pic.png'); /* 背景画像 */
            background-size: cover;
            background-position: center;
            color: #fff;
            margin-bottom: 4rem;
        }
        .page-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
        }
        .page-title-content {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-top: 12rem; /* 位置を下に調整 */
        }
        .page-title {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 1rem;
            font-family: 'Montserrat', sans-serif;
        }

        /* フォーム用の簡易スタイル */
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        .form-control {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .form-actions { display:flex; justify-content:center; gap:12px; align-items:center; }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="./assets/img/osda.png" alt="れいたくラジオロゴ">
            </a>

            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>

            <ul class="nav-links">
                <li><a href="./about.html">About</a></li>
                <li><a href="./works.html">Works</a></li>
                <li><a href="./news.html">News</a></li>
                <li><a href="./episodes.html">Episodes</a></li>
                <li><a href="./letters.html" class="btn-primary">おたよりフォーム</a></li>

                    <p style="margin:0 0 12px 0; color:#555;">学生団体や企業からの取材依頼、CM制作やコラボ等のお問い合わせはこちらからご連絡ください。</p>
                    <div style="display:flex; gap:12px; justify-content:center;">
                        <a href="works.html" class="btn-primary-outline">制作・依頼について</a>

                </div>
            </div>
        </section>

    <!-- Removed client-side mailto form handler: using embedded Google Form instead -->

    <footer class="footer">
        <div class="container footer-content">
